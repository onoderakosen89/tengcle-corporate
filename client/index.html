    // Initialize dataLayer and gtag function

    function gtag() { dataLayer.push(arguments); }

    // Set default consent to denied (GDPR compliant)
    gtag('consent', 'default', {
      'analytics_storage': 'denied',
      'ad_storage': 'denied',
      'ad_user_data': 'denied',
      'ad_personalization': 'denied',
      'wait_for_update': 500
    });
    
    // Check for existing consent and update accordingly
    (function() {
      var consent = localStorage.getItem('tengcle-cookie-consent');
      if (consent === 'accepted-all') {
        gtag('consent', 'update', {
          'analytics_storage': 'granted',
          'ad_storage': 'granted',
          'ad_user_data': 'granted',
          'ad_personalization': 'granted'
        });
      }
    })();
    
    // Load GA script (consent mode will control what data is collected)
    function loadGA() {
      if (window.gaLoaded) return;
      window.gaLoaded = true;
      
      var script = document.createElement('script');
      script.async = true;
      script.src = 'https://www.googletagmanager.com/gtag/js?id=G-JE6B15C29Q';
      document.head.appendChild(script);
      
      script.onload = function() {
        gtag('js', new Date());
        gtag('config', 'G-JE6B15C29Q', {
          'anonymize_ip': true,
          'cookie_flags': 'SameSite=None;Secure'
        });
      };
    }
    
    // Load GA after user interaction or after 2 seconds
    ['scroll', 'click', 'keydown', 'mousemove', 'touchstart'].forEach(function(event) {
      window.addEventListener(event, loadGA, { once: true, passive: true });
    });
    setTimeout(loadGA, 2000);
  </script>
