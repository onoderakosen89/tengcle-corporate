<svg xmlns="http://www.w3.org/2000/svg" width="192" height="96" viewBox="0 0 192 96">
  <title>Decorative Seigaiha-inspired repeat</title>
  <metadata>Authored for Tengcle Site 2.0 on 2026-08-26. Original 192 x 96 geometry based on the traditional wave motif; not traced from the legacy data URI.</metadata>
  <defs>
    <g id="wave" fill="none" stroke="#d7c49d" stroke-width="1">
      <circle r="42" opacity=".34"/><circle r="32" opacity=".28"/>
      <circle r="22" opacity=".22"/><circle r="12" opacity=".16"/>
    </g>
  </defs>
  <g aria-hidden="true">
    <use href="#wave" x="0" y="48"/><use href="#wave" x="64" y="48"/>
    <use href="#wave" x="128" y="48"/><use href="#wave" x="192" y="48"/>
    <use href="#wave" x="32" y="0"/><use href="#wave" x="96" y="0"/>
    <use href="#wave" x="160" y="0"/><use href="#wave" x="32" y="96"/>
    <use href="#wave" x="96" y="96"/><use href="#wave" x="160" y="96"/>
